<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logo marks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#1A1715; --ink:#EEEEF1; --ash:#9A9AA3;}
  *{box-sizing:border-box; margin:0;}
  body{min-height:100vh; padding:28px; background:radial-gradient(58% 66% at 30% 112%, rgba(255,106,43,.7), transparent 76%), var(--bg); background-attachment:fixed;
    color:var(--ink); font-family:'Geist', system-ui, sans-serif; display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:16px;}
  .t{border-radius:22px; padding:18px 18px 16px; display:flex; flex-direction:column; gap:14px;
    background:linear-gradient(160deg, rgba(255,255,255,.07), rgba(255,255,255,.02)); box-shadow:inset 0 1px 0 rgba(255,255,255,.09), inset 0 0 0 1px rgba(255,255,255,.06);}
  .n{font-size:13px; color:var(--ash);} .n b{color:var(--ink); font-weight:500;}
  .big{height:150px; display:grid; place-items:center;}
  .big svg{width:104px; height:104px; filter:drop-shadow(0 10px 18px rgba(0,0,0,.45));}
  /* the mark at its real size, in a header */
  .hdr{display:flex; align-items:center; justify-content:space-between; padding:12px 14px; border-radius:14px; background:rgba(0,0,0,.25); font-size:12.5px; color:var(--ash);}
  .hdr svg{width:28px; height:28px;}
  .hdr span{display:flex; gap:14px;} .hdr span i{font-style:normal;} .hdr span i:first-child{color:var(--ink);}
</style>
</head>
<body>
<!-- one rose-gold fill shared by every mark: a pink-copper metal with a soft highlight -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCE6DA"/><stop offset=".38" stop-color="#EBB39E"/><stop offset=".62" stop-color="#F8D4C4"/><stop offset="1" stop-color="#C4826B"/>
    </linearGradient>
    <radialGradient id="hl" cx=".32" cy=".26" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  </defs>
</svg>
<div id="marks"></div>
<script>
// each mark is drawn on a 48 x 48 grid; "hl" adds a soft highlight over the same shape
const marks = [
  ['Мягкая капля-пятно', 'Плавная органичная форма, как камешек', '<path d="M25 5c9 0 17 6 18 15 1 8-3 13-8 17-6 5-13 7-20 4C8 38 5 31 6 24 7 13 15 5 25 5z"/>'],
  ['Две сферы', 'Два пересекающихся круга: сложное и простое', '<circle cx="18" cy="24" r="12"/><circle cx="30" cy="24" r="12" fill-opacity=".72"/>'],
  ['Сквиркл с вырезом', 'Мягкий квадрат с круглым окном, как кнопка или экран', '<path fill-rule="evenodd" d="M24 4c13 0 20 7 20 20s-7 20-20 20S4 37 4 24 11 4 24 4zm0 12a8 8 0 1 0 0 16 8 8 0 0 0 0-16z"/>'],
  ['Пухлая звёздочка', 'Четыре мягких луча, как у иконки AI', '<path d="M24 4c2.5 9 6 12.5 15 15 3.5 1 3.5 4 0 5-9 2.5-12.5 6-15 15-1 3.5-4 3.5-5 0-2.5-9-6-12.5-15-15-3.5-1-3.5-4 0-5 9-2.5 12.5-6 15-15 1-3.5 4-3.5 5 0z" transform="translate(2.5 0)"/>'],
  ['Петля бесконечности', 'Плавная непрерывная линия: поток и система', '<path d="M14 16c-5 0-9 3.6-9 8s4 8 9 8c7 0 13-16 20-16 5 0 9 3.6 9 8s-4 8-9 8c-7 0-13-16-20-16z" fill="none" stroke="url(#rg)" stroke-width="5.5" stroke-linecap="round"/>'],
  ['Цветок из четырёх лепестков', 'Модули дизайн-системы, собранные в одно', '<circle cx="24" cy="14" r="9"/><circle cx="34" cy="24" r="9"/><circle cx="24" cy="34" r="9"/><circle cx="14" cy="24" r="9"/>'],
  ['Капля', 'Простая мягкая капля с наклоном', '<path d="M24 5c6 9 15 17 15 26a15 15 0 0 1-30 0c0-9 9-17 15-26z"/>'],
  ['Волна в круге', 'Плавная S-кривая делит круг на две части', '<path fill-rule="evenodd" d="M24 4a20 20 0 1 1 0 40 20 20 0 0 1 0-40zm0 4c-5 0-8 4-8 8s4 6 8 8 8 4 8 8-3 8-8 8a16 16 0 0 0 0-32z"/>'],
  ['Две пилюли', 'Две скруглённые формы со сдвигом, как буквы MD', '<rect x="7" y="8" width="14" height="32" rx="7"/><rect x="25" y="14" width="14" height="26" rx="7" fill-opacity=".75"/>'],
  ['Галька с искрой', 'Мягкий камешек с маленькой звёздочкой внутри', '<path fill-rule="evenodd" d="M24 6c11 0 19 7 19 17 0 11-8 19-19 19S5 34 5 23 13 6 24 6zm0 10c-1 3.5-2.5 5-6 6 3.5 1 5 2.5 6 6 1-3.5 2.5-5 6-6-3.5-1-5-2.5-6-6z"/>'],
  ['Полумесяц', 'Мягкий полумесяц с круглыми концами', '<path d="M30 6a18 18 0 1 0 12 30A15 15 0 0 1 30 6z"/>'],
  ['Лист', 'Плавный лист с прожилкой-вырезом', '<path fill-rule="evenodd" d="M8 40C8 20 20 8 40 8c0 20-12 32-32 32zm5-3c6-7 12-13 20-20l-1.5-1.5C24 22 18 28 11.5 35.5z"/>'],
  ['Три точки', 'Три мягких круга треугольником: связи в системе', '<circle cx="24" cy="13" r="8"/><circle cx="13" cy="33" r="8"/><circle cx="35" cy="33" r="8"/>'],
  ['Кольцо', 'Толстое гладкое кольцо, как бублик', '<path fill-rule="evenodd" d="M24 5a19 19 0 1 1 0 38 19 19 0 0 1 0-38zm0 11a8 8 0 1 0 0 16 8 8 0 0 0 0-16z"/>'],
  ['Буква M одной линией', 'Мягкая M непрерывным штрихом', '<path d="M8 38V16c0-5 7-6 9-1l7 16 7-16c2-5 9-4 9 1v22" fill="none" stroke="url(#rg)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>'],
  ['Радуга из арок', 'Три вложенные арки: слои продукта', '<path d="M6 38a18 18 0 0 1 36 0" fill="none" stroke="url(#rg)" stroke-width="5" stroke-linecap="round"/><path d="M14 38a10 10 0 0 1 20 0" fill="none" stroke="url(#rg)" stroke-width="5" stroke-linecap="round"/><circle cx="24" cy="38" r="3"/>'],
  ['Фасолина', 'Мягкая форма с двумя округлыми долями', '<path d="M16 7c6 0 8 5 13 5 8 0 13 6 13 13 0 9-8 16-19 16C11 41 6 33 6 24 6 14 10 7 16 7z"/>'],
  ['Спираль', 'Плавная спираль, разворачивающаяся наружу', '<path d="M25 25c0-2-3-2.5-4-.5-1.5 3 2 6 5.5 5 5-1.5 6-8 1.5-11.5-5-4-13-1.5-15 5-2.5 8 4 16 13 15 10-1 16-11 13-20" fill="none" stroke="url(#rg)" stroke-width="5" stroke-linecap="round"/>'],
  ['Облачко', 'Пухлое облако из мягких кругов', '<path d="M14 38a8 8 0 0 1-1-16 11 11 0 0 1 21-4 9 9 0 0 1 2 20z"/>'],
  ['Два сквиркла', 'Два мягких квадрата внахлёст со сдвигом', '<rect x="5" y="5" width="25" height="25" rx="9"/><rect x="18" y="18" width="25" height="25" rx="9" fill-opacity=".72"/>'],
];
const host = document.getElementById('marks');
marks.forEach(([name, note, shape], i) => {
  const svg = (fill) => `<svg viewBox="0 0 48 48" aria-hidden="true"><g fill="url(#rg)">${shape}</g>${fill ? `<g fill="url(#hl)" opacity=".55">${shape.replace(/fill="none" stroke="url\(#rg\)"/, 'fill="none" stroke="url(#hl)"')}</g>` : ''}</svg>`;
  const t = document.createElement('section');
  t.className = 't';
  t.innerHTML = `<p class="n"><b>${String(i + 1).padStart(2, '0')} · ${name}</b><br>${note}</p>
    <div class="big">${svg(true)}</div>
    <div class="hdr">${svg(true)}<span><i>Work</i><i>About</i><i>Contact</i></span></div>`;
  document.body.appendChild(t);
});
host.remove();
</script>
</body>
</html>
