<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Maria Demenko — Product Designer</title>
<meta name="description" content="Product designer with 7 years in B2B SaaS, retail and delivery software. Complex systems, design systems and AI-assisted prototyping.">
<link rel="icon" href="assets/favicon.ico" sizes="32x32">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#0E0E11">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Noto+Serif+Display:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/grid.css">
</head>
<body>
<!-- the black glyphs share one glossy fill and one cast shadow -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3533"/><stop offset=".45" stop-color="#121010"/><stop offset="1" stop-color="#030303"/>
    </linearGradient>
    <filter id="cast" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="5" dy="9" stdDeviation="6" flood-color="#2b2e36" flood-opacity=".55"/>
    </filter>
  </defs>
</svg>

<main class="board picker">
  <article class="card">
    <span class="card-no">00</span>
    <span class="card-glyph" aria-hidden="true" data-shape="cursor"></span>
    <h2>Сейчас: курсор и звёздочка</h2>
    <p class="lead">Current: cursor + sparkle</p>
    <span class="foil" aria-hidden="true"></span>
    <span class="glass" aria-hidden="true"></span>
  </article>
  <article class="card">
    <span class="card-no">01</span>
    <span class="card-glyph" aria-hidden="true" data-shape="sparkCode"></span>
    <h2>Звёздочка и код</h2>
    <p class="lead">Sparkle + code</p>
    <span class="foil" aria-hidden="true"></span>
    <span class="glass" aria-hidden="true"></span>
  </article>
  <article class="card">
    <span class="card-no">02</span>
    <span class="card-glyph" aria-hidden="true" data-shape="sparkWindow"></span>
    <h2>Звёздочка и окно приложения</h2>
    <p class="lead">Sparkle + app window</p>
    <span class="foil" aria-hidden="true"></span>
    <span class="glass" aria-hidden="true"></span>
  </article>
  <article class="card">
    <span class="card-no">03</span>
    <span class="card-glyph" aria-hidden="true" data-shape="sparkWand"></span>
    <h2>Волшебная палочка</h2>
    <p class="lead">Magic wand</p>
    <span class="foil" aria-hidden="true"></span>
    <span class="glass" aria-hidden="true"></span>
  </article>
  <article class="card">
    <span class="card-no">04</span>
    <span class="card-glyph" aria-hidden="true" data-shape="sparkChat"></span>
    <h2>Облачко чата</h2>
    <p class="lead">Chat bubble</p>
    <span class="foil" aria-hidden="true"></span>
    <span class="glass" aria-hidden="true"></span>
  </article>
</main>
<style>.picker .card{grid-area:auto !important;} .picker{padding-top:40px;}</style>
<script src="assets/grid.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module" src="assets/glyph3d.js"></script>
</body>
</html>
